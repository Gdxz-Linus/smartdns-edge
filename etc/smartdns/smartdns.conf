# ==========================================
# SmartDNS 核心配置文件 (Windows 测速优选版)
# ==========================================

bind [::]:53
bind-tcp [::]:53

log-level info
log-size 1M
log-num 2
log-file ./smartdns.log

prefetch-domain yes
serve-expired yes
serve-expired-reply-ttl 5
serve-expired-ttl 28800
serve-expired-prefetch-time 7200

cache-size 4096
cache-persist yes
cache-checkpoint-time 7200
cache-file ./smartdns.cache

response-mode fastest-ip
speed-check-mode tcp:443,ping

dualstack-ip-selection yes
dualstack-ip-selection-threshold 10

rr-ttl-min 180
rr-ttl-max 600
local-ttl 600

server 127.0.0.1:8056 -group cf_node -exclude-default-group
server-https 223.5.5.5 -host-name dns.alidns.com -group cf_node
server-https 223.6.6.6 -host-name dns.alidns.com -group cf_node
server-https 1.12.12.12 -host-name doh.pub -group cf_node
server-https 120.53.53.53 -host-name doh.pub -group cf_node

nameserver /cmcc.877774.xyz/cf_node
nameserver /cm.cf.mubaiovo.top/cf_node

server-https 43.154.154.162 -host-name dns.flymc.cc -group gfw -exclude-default-group
server-https 47.243.233.55 -host-name sunnygyl.com -group gfw -exclude-default-group

domain-set -name gfw_cn -file ./gfw.txt
domain-rules /domain-set:gfw_cn/ -nameserver gfw -speed-check-mode none

conf-file ./anti-ad-smartdns.conf




