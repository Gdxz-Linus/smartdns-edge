# ==========================================
# SmartDNS 核心配置文件 (Windows 测速优选版)
# ==========================================

bind [::]:53
bind-tcp [::]:53

log-level info
log-size 1M
log-num 2
log-file ./smartdns.log

prefetch-domain yes
serve-expired yes
serve-expired-reply-ttl 5
serve-expired-ttl 28800
serve-expired-prefetch-time 7200

cache-size 4096
cache-persist yes
cache-checkpoint-time 7200
cache-file ./smartdns.cache

response-mode fastest-ip
speed-check-mode tcp:443,ping

dualstack-ip-selection yes
dualstack-ip-selection-threshold 10

rr-ttl-min 180
rr-ttl-max 600
local-ttl 600

server-https 223.5.5.5 -host-name dns.alidns.com
server-https 223.6.6.6 -host-name dns.alidns.com
server-https 1.12.12.12 -host-name doh.pub
server-https 120.53.53.53 -host-name doh.pub






