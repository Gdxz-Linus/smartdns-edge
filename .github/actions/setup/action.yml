name: "Setup"
description: "Install Rust toolchain and optional CI tools."

inputs:
  install_rust:
    description: "Install Rust toolchain."
    required: false
    default: "true"
  rust_toolchain:
    description: "Rust toolchain channel/version."
    required: false
    default: "stable"
  rust_target:
    description: "Rust target triple to install."
    required: false
    default: ""
  rust_components:
    description: "Comma-separated rust components, e.g. rustfmt,clippy."
    required: false
    default: ""
  install_just:
    description: "Install just command runner."
    required: false
    default: "true"
  # ⚠️ 默认 **false**：需要交叉编译的任务才用得上 cross（判据是 justfile 里的 USE_CROSS）。
  #
  # 原先默认 true，于是**每个**调用点都会装一次 —— 包括根本不用它的 test 与 cleanliness 任务。
  # 白花时间之外还有个副作用：在 ARM64 Linux 运行器（ubuntu-24.04-arm）上，
  # install-action 找不到 `cross@latest` 的对应物，会退回 cargo-binstall 并**报一条 warning**
  # （见 test 任务的运行记录）。
  #
  # 需要它的任务显式传 "true"：build.yml 的 Build 与 test.yml 的 compatibility。
  install_cross:
    description: "Install cross on Linux runners (only needed by jobs that set USE_CROSS=true)."
    required: false
    default: "false"
  install_wix:
    description: "Install Wix toolset on Windows runners."
    required: false
    default: "true"
  install_cargo_edit:
    description: "Install cargo-edit."
    required: false
    default: "true"
  install_patch_crate:
    description: "Install patch-crate."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install Rust Toolchain (target + components)
      if: ${{ inputs.install_rust == 'true' && inputs.rust_target != '' && inputs.rust_components != '' }}
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: ${{ inputs.rust_toolchain }}
        target: ${{ inputs.rust_target }}
        components: ${{ inputs.rust_components }}

    - name: Install Rust Toolchain (target only)
      if: ${{ inputs.install_rust == 'true' && inputs.rust_target != '' && inputs.rust_components == '' }}
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: ${{ inputs.rust_toolchain }}
        target: ${{ inputs.rust_target }}

    - name: Install Rust Toolchain (components only)
      if: ${{ inputs.install_rust == 'true' && inputs.rust_target == '' && inputs.rust_components != '' }}
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: ${{ inputs.rust_toolchain }}
        components: ${{ inputs.rust_components }}

    - name: Install Rust Toolchain (default)
      if: ${{ inputs.install_rust == 'true' && inputs.rust_target == '' && inputs.rust_components == '' }}
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: ${{ inputs.rust_toolchain }}

    - name: Install just
      if: ${{ inputs.install_just == 'true' }}
      uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
      with:
        tool: just

    - name: Install cross
      if: ${{ inputs.install_cross == 'true' && runner.os == 'Linux' }}
      uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
      with:
        tool: cross

    - name: Install cargo-edit
      if: ${{ inputs.install_cargo_edit == 'true' }}
      uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
      with:
        tool: cargo-edit

    - name: Install patch-crate
      if: ${{ inputs.install_patch_crate == 'true' }}
      uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
      with:
        tool: patch-crate

