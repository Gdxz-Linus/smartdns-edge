# .github/workflows/test.yml

name: Test

on:
  workflow_dispatch: # 允许你随时在网页上点按钮手动体检
  # 🔐 P2：发布流程（version.yml -> build.yml）会调用本工作流做发布前门禁，
  # 因此这里必须声明 workflow_call，否则 `uses: ./.github/workflows/test.yml` 会报错。
  workflow_call:
  # 推到这些分支时也自动体检（原配置只在提 PR 时跑，直接推 main 不会触发）
  push:
    branches:
      - main
      - release/**
    # 🔐 第十批 B 组（问题 18 的延伸）：**避免"版本号提交"引发一次多余的完整测试**。
    #
    # 背景（实测确认，不是推测）：发版流程是
    #   version.yml：test（门禁）→ bump（改版本号并 `git push --follow-tags`）→ build
    # 而 bump 那次 `git push` 推到 main 会**再触发本工作流一次** ——
    # 于是每次发版都多跑一整轮（5 平台 test + cleanliness + compatibility，共 12 个 job），
    # 而它测的是"只动了版本号"的提交。
    #
    # 依据：`git log` 查过历史上所有 `🔖 Bump version` 提交，**只改这两个文件、各一行**
    # （`cargo set-version` 的行为）。所以只忽略它们。
    #
    # ⚠️ **为什么不忽略 RELEASE_NOTES.md**：它虽然也含版本号，但发版前常会写实质内容
    # （功能说明、行为变化），那**必须**被测到。宁可多测一次，也不放过可能的实质改动。
    #
    # ⚠️ **安全兜底**：即使某次提交"只改版本号"却被这里跳过，发布链路上的
    # **version.yml 门禁仍会在发版那一刻完整测一遍**（见 version.yml 的 `bump: needs: ["test"]`）。
    # 所以这里省掉的是"重复"，不是"把关"。
    paths-ignore:
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches:
      - main
      - release/**

# 🔐 第十批 B 组：**同一来源上只保留最新一次运行**。
#
# 为什么加：连续推送时，旧的那次测试已经"过时"了（代码又变了），
# 让它继续占着 runner 跑完没有意义。
#
# ⚠️⚠️ **group 里必须带 `github.event_name`**（这里踩过一个会静默废掉问题 18 修复的坑）：
#   如果 group 只用 `workflow` + `ref`，那么"普通 push 触发的测试"与
#   "发布门禁调用的测试"可能落进**同一个组**。此时新来的 push 运行
#   （它的 `cancel-in-progress` 为真）会把**正在跑的发布门禁取消掉** ——
#   而门禁被取消后，`version.yml` 的 `bump` 仍会以为"测试通过了"而继续推送远端。
#   那正好把问题 18 的修复变成摆设。
#   带上 `event_name` 后：push 是 `push`、门禁是 `workflow_call`/`workflow_dispatch`，
#   **永远是不同的组**，普通推送不可能碰到门禁。
#
# ⚠️ `cancel-in-progress` 只在**自动触发**（push / pull_request）时为真；
# 门禁（workflow_call）与手动体检（workflow_dispatch）**一律不被取消**。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  # 🧪 跑单测。矩阵与 build.yml 的发布矩阵一一对应，且每条都落在与目标架构相同的运行器上，
  # 因此跑的是真机原生测试，不再是"号称交叉编译、实际跑主机架构"。
  # 唯一的例外是 x86_64-apple-darwin —— Apple 已无 Intel 运行器，它只能在 ARM64 运行器上
  # 交叉编译，故只放在下面的 compatibility 任务里做编译覆盖。
  test:
    name: test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm # ARM64 原生运行器
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm # ARM64 原生运行器
          - target: aarch64-apple-darwin
            os: macos-latest # macos-latest 本身即 Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust_target: ${{ matrix.target }}
          install_patch_crate: "false"
          install_wix: "false"
          install_cargo_edit: "false"
          # 全部为原生运行器，不使用 cross —— 显式关掉：默认值已改为 false，写出来是为了
          # 让"这里不需要 cross"成为可见的意图，而不是靠默认值碰巧成立。
          install_cross: "false"

      # 全部为原生运行器，不使用 cross（cross 是给交叉编译用的）
      - name: Test
        run: just test --features=disable_icmp_ping
        env:
          USE_CROSS: "false"
          # 真连公网 DNS 的那几条用例（src/dns_client.rs）按项目约定只在有环境变量时运行，
          # 否则打印说明并跳过；CI 里显式打开，保证这条链路仍然被真实验证。
          SMARTDNS_TEST_RESOLVE: "1"
          SMARTDNS_TEST_TLS_URLS: "tls://dns.google?enable_sni=false,tls://dns.cloudflare.com?enable_sni=false,tls://dot.pub"

      - name: Setup upterm session for debugging
        uses: lhotari/action-upterm@b0357f23233f5ea6d58947c0c402e0631bab7334 # v1
        if: ${{ failure() }}
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 5

  # 🧹 代码风格与静态检查：与目标平台无关，只跑一次。
  # 原先是按 3 个目标各跑一遍，但 runs-on 写死 ubuntu-latest，三次重复的是同一个主机检查。
  cleanliness:
    name: cleanliness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust_target: x86_64-unknown-linux-gnu
          install_patch_crate: "false"
          install_wix: "false"
          install_cargo_edit: "false"

      - name: Install Rust Toolchain Components
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Clippy & Rustfmt
        run: just cleanliness

  # 🧭 编译覆盖：与发布矩阵完全一致（6 个目标），并带 -D warnings。
  # 只在某个平台编得到的那些分支出问题，会在这一步暴露（包括 Intel 版 macOS）。
  compatibility:
    name: compatibility ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
    runs-on: ${{matrix.os}}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust_target: ${{ matrix.target }}
          install_patch_crate: "false"
          install_wix: "false"
          install_cargo_edit: "false"
          # Linux 目标走 cross 交叉编译（见下面 Check 步骤的 USE_CROSS）
          install_cross: "true"

      - name: Check
        run: just check --target ${{ matrix.target }}
        env:
          USE_CROSS: ${{ matrix.os == 'ubuntu-latest' }}
