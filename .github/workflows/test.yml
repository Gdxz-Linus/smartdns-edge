# .github/workflows/test.yml

name: Test

on:
  workflow_dispatch: # 允许你随时在网页上点按钮手动体检
  # 🔐 P2：发布流程（version.yml -> build.yml）会调用本工作流做发布前门禁，
  # 因此这里必须声明 workflow_call，否则 `uses: ./.github/workflows/test.yml` 会报错。
  workflow_call:
  # 推到这些分支时也自动体检（原配置只在提 PR 时跑，直接推 main 不会触发）
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**

jobs:
  # 🧪 跑单测。矩阵与 build.yml 的发布矩阵一一对应，且每条都落在与目标架构相同的运行器上，
  # 因此跑的是真机原生测试，不再是"号称交叉编译、实际跑主机架构"。
  # 唯一的例外是 x86_64-apple-darwin —— Apple 已无 Intel 运行器，它只能在 ARM64 运行器上
  # 交叉编译，故只放在下面的 compatibility 任务里做编译覆盖。
  test:
    name: test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm # ARM64 原生运行器
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm # ARM64 原生运行器
          - target: aarch64-apple-darwin
            os: macos-latest # macos-latest 本身即 Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust_target: ${{ matrix.target }}
          install_patch_crate: "false"
          install_wix: "false"
          install_cargo_edit: "false"

      # 全部为原生运行器，不使用 cross（cross 是给交叉编译用的）
      - name: Test
        run: just test --features=disable_icmp_ping
        env:
          USE_CROSS: "false"

      - name: Setup upterm session for debugging
        uses: lhotari/action-upterm@v1
        if: ${{ failure() }}
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 5

  # 🧹 代码风格与静态检查：与目标平台无关，只跑一次。
  # 原先是按 3 个目标各跑一遍，但 runs-on 写死 ubuntu-latest，三次重复的是同一个主机检查。
  cleanliness:
    name: cleanliness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust_target: x86_64-unknown-linux-gnu
          install_patch_crate: "false"
          install_wix: "false"
          install_cargo_edit: "false"

      - name: Install Rust Toolchain Components
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Clippy & Rustfmt
        run: just cleanliness

  # 🧭 编译覆盖：与发布矩阵完全一致（6 个目标），并带 -D warnings。
  # 只在某个平台编得到的那些分支出问题，会在这一步暴露（包括 Intel 版 macOS）。
  compatibility:
    name: compatibility ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
    runs-on: ${{matrix.os}}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust_target: ${{ matrix.target }}
          install_patch_crate: "false"
          install_wix: "false"
          install_cargo_edit: "false"

      - name: Check
        run: just check --target ${{ matrix.target }}
        env:
          USE_CROSS: ${{ matrix.os == 'ubuntu-latest' }}
