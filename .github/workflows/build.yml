# .github/workflows/build.yml
name: Build

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
      features:
        type: string
        required: false
        default: default
        description: Space or comma separated list of features to activate
      prerelease:
        type: boolean
        description: "Identify the release as a prerelease. Defaults to false"
        required: false

  workflow_dispatch:
    inputs:
      features:
        type: string
        required: false
        default: default
        description: Space or comma separated list of features to activate

jobs:
  build:
    name: build ${{ matrix.target }} ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows: 64位企业x86 与 ARM64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
          
          # 2. macOS: Intel 与 Apple Silicon
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: zip
          
          # 3. Linux: 64位企业x86 与 ARM64架构
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst

    runs-on: ${{matrix.os}}
    env:
      DIST_DIR: smartdns-${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version }}

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust_target: ${{ matrix.target }}
          # Linux 目标走 cross 交叉编译（见下面 Build 步骤的 USE_CROSS）
          install_cross: "true"
          install_patch_crate: "false" 
          install_wix: "false" 
          install_cargo_edit: "false" 

      - name: Build
        run: just build --release --no-default-features --features ${{ inputs.features }} --target=${{ matrix.target }}
        env:
          USE_CROSS: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Package
        run: just target=${{ matrix.target }} pack
        shell: bash

      # 1. 先计算精准的版本号标签 (如 v1.0.1)
      - name: Compute release label
        id: release_label
        uses: ./.github/actions/sanitize-label
        with:
          raw_label: ${{ inputs.version || github.ref_name }}
          fallback_sha: ${{ github.sha }}

      # 2. 🌟 核心修复：基于精确版本号，绝对不误删扩展名，绝对不碰撞文件夹名！
      - name: Strip version suffix from dist artifacts
        run: |
          python3 -c '
          import os, re
          label = "${{ steps.release_label.outputs.value }}".lstrip("v")
          dist_dir = "dist"
          if label and os.path.exists(dist_dir):
              # 精准匹配 -v1.0.1 或 -1.0.1，绝对不碰扩展名
              pattern = re.compile(rf"-v?{re.escape(label)}")
              for f in os.listdir(dist_dir):
                  filepath = os.path.join(dist_dir, f)
                  if os.path.isfile(filepath):
                      # 修正 sha256 文本内部的内容
                      if f.endswith(".txt") or "sha256" in f:
                          with open(filepath, "r", encoding="utf-8", errors="ignore") as fp:
                              content = fp.read()
                          new_content = pattern.sub("", content)
                          with open(filepath, "w", encoding="utf-8") as fp:
                              fp.write(new_content)

                      # 修正文件名本身
                      new_f = pattern.sub("", f)
                      if new_f != f:
                          os.rename(filepath, os.path.join(dist_dir, new_f))
          '
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smartdns-${{ matrix.target }}-${{ steps.release_label.outputs.value }}
          retention-days: 30
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.msi
            dist/*.exe
            dist/*sha256sum.txt

      # 🔐 问题 17：**发布前的独立复核**。
      #
      # 背景：`zip-sha256sum`（justfile）本来就会生成 `*-sha256sum.txt` 并随产物发布，
      # 但那一步与打包**出自同一次执行** —— 它只能证明"下载途中没损坏"，
      # 证明不了"发布链路上产物没被替换"（算它的和用它是同一方）。
      #
      # 这里在**发布之前**、用**独立的一遍**重新计算每个产物的 SHA256，并与自带的
      # 校验文件比对：不一致就**直接失败、不发布**。
      #
      # ⚠️ 格式必须按实际生成物来（**这里踩过一次，写下来免得后人重复**）：
      #   校验文件由 justfile 的 `sha256_file()` 生成，它返回的是
      #   **纯哈希字符串（64 位十六进制），不含文件名** —— 因此
      #   `sha256sum -c` **无法解析**（它要求 `<hash>  <filename>` 两列）。
      #   所以这里改为：自己重算哈希（`sha256sum <file>`），再与文件里的哈希值比字符串。
      - name: Verify artifact checksums before publishing (independent recompute)
        shell: bash
        run: |
          set -uo pipefail
          cd dist
          fail=0
          found=0

          for sumfile in *-sha256sum.txt; do
            [ -e "$sumfile" ] || continue
            found=1

            # 校验文件形如 `smartdns-xxx-v1.0.2.tar.gz-sha256sum.txt`，
            # 去掉后缀即它对应的产物名。
            artifact="${sumfile%-sha256sum.txt}"
            expected="$(tr -d '[:space:]' < "$sumfile")"

            echo "::group::verify $artifact"
            echo "expected: $expected"

            if [ ! -e "$artifact" ]; then
              echo "::error::$artifact is listed by $sumfile but missing from dist/"
              fail=1
              echo "::endgroup::"
              continue
            fi

            # 独立的一遍计算
            actual="$(sha256sum "$artifact" | awk '{print $1}')"
            echo "actual  : $actual"

            if [ "$expected" != "$actual" ]; then
              echo "::error::$artifact does not match its recorded checksum"
              fail=1
            else
              echo "OK"
            fi
            echo "::endgroup::"
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::no *-sha256sum.txt was produced — cannot verify artifacts before publishing"
            fail=1
          fi

          # 每个待发布的归档都必须有对应的校验文件（防止漏算）
          for art in *.zip *.tar.gz *.tar.xz *.tar.zst *.msi *.exe; do
            [ -e "$art" ] || continue
            if [ ! -e "$art-sha256sum.txt" ]; then
              echo "::error::$art has no matching $art-sha256sum.txt"
              fail=1
            fi
          done

          exit $fail

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: ${{ startsWith(inputs.version, 'v') }}
        with:
          draft: false
          prerelease: ${{ inputs.prerelease }}
          tag_name: ${{ inputs.version }}
          # Release 说明直接取自仓库根目录的 RELEASE_NOTES.md（发版前更新该文件即可，不用手动粘贴）
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.msi
            dist/*.exe
            dist/*sha256sum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      - name: Rename artifacts
        run: |
          mv smartdns-x86_64-unknown-linux-gnu-*/smartdns-x86_64-*.tar.gz ./smartdns-x86_64-generic-linux-gnu.tar.gz || true
          mv smartdns-aarch64-unknown-linux-gnu-*/smartdns-aarch64-*.tar.gz ./smartdns-aarch64-generic-linux-gnu.tar.gz || true
        shell: bash
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Compute release label
        id: release_label
        uses: ./.github/actions/sanitize-label
        with:
          raw_label: ${{ inputs.version || github.ref_name }}
          fallback_sha: ${{ github.sha }}
      - name: Build and push Docker image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/smartdns-edge"
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          TAG_VERSION="${{ steps.release_label.outputs.value }}"
          
          # 1. 默认设置：始终打上版本号标签（如 :v1.0.1）
          TAGS="-t ${IMAGE_NAME_LOWER}:${TAG_VERSION}"
          
          # 2. 智能判断：如果是正式版本（非 prerelease）且版本号以 "v" 开头，额外追加 :latest 标签
          if [ "${{ inputs.prerelease }}" != "true" ] && [[ "$TAG_VERSION" =~ ^v[0-9] ]]; then
            TAGS="$TAGS -t ${IMAGE_NAME_LOWER}:latest"
          fi
          
          # 3. 执行多架构编译并推送
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION=${{ inputs.version }} $TAGS --push -f ./docker/Dockerfile .