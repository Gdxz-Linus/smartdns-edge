<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDNS Edge - Smart DNS Gateway</title>
    <!-- 🔐 问题 23：内容安全策略（CSP）。
         对比：程序自己的管理后台早就有一整套 CSP（见 `src/api/mod.rs` 的 `SECURITY_CSP`），
         官网作为"用户下载安装包 + 提交反馈"的入口反而没有 —— 做法应当向后台看齐。

         这份策略是照着**页面实际用到的资源**逐项写的，不是照抄一个宽松模板：
           · default-src 'none'        —— 默认什么都不许，其余按需开口（最小权限）
           · script-src  'self' + jsDelivr —— 只放行本站脚本（app.js）与那个已固定版本+带 SRI 的 marked
           · style-src   'self' 'unsafe-inline' —— 页面用了内联 style 块与若干内联 style 属性
           · img-src     'self' data: + komarev.com —— 允许图标与那个访问计数请求
           · connect-src 'self'         —— fetch 只用于本站（抓取 Markdown、提交反馈到 /feedback）
           · base-uri 'none'、form-action 'self'、object-src 'none' —— 挡 base 劫持、表单外发与插件

         ⚠️ **三点如实说明（不能假装完整）**：
         ① `frame-ancestors` 与 `report-uri` 在 meta 形式下**按规范无效**，只在 HTTP 响应头里生效。
            真正的防内嵌靠部署侧的响应头（已附 `docs/_headers` 供 Cloudflare Pages 使用），
            且**需要部署后实际验证**（配置没生效时代码不会报错）。
         ② `script-src` 里**没有** `'unsafe-inline'` —— 为此做过两件事：
            · 把两处内联事件处理器（`onchange=` / `onclick=`）改为 `addEventListener`；
            · 把原先内联的 ~460 行脚本抽到外部 `app.js`。
            若日后往 HTML 里加内联 `on*=` 属性或新的内联 script 块，**它们会被 CSP 拦下**，
            这是有意为之：请改用外部文件与事件绑定，而不是给 CSP 加 `'unsafe-inline'`。
         ③ 本策略**实测过一次失败**：最初只改内联事件、没意识到还有内联脚本块，
            结果整页脚本被拦、官网白屏（正文卡在 Loading、导航为空）。
            是浏览器真机验证抓出来的 —— 静态检查完全看不出来。详见审查报告 §32。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://komarev.com; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
    <!-- 引入 Marked.js 用于客户端 Markdown 解析
         🔐 问题 23：**必须固定版本 + 带 SRI 完整性校验**。
         原来写的是 `npm/marked/marked.min.js`（不带版本）：
         jsDelivr 会把"无版本"解析成**当前最新版**，也就是说——
         该 CDN 或该包一旦被投毒/发新版，官网会在**没有任何记录**的情况下执行新代码。
         而这里正是用户下载安装包、提交反馈（后端存着仓库令牌）的入口，风险不在"官网显示异常"，
         而在"攻击者在下载链路上做手脚"。
         现在锁定 15.0.7（页面只用 `marked.parse()`，是该库最稳定的 API），
         并用 `integrity` 钉住文件内容：浏览器会在执行前校验哈希，对不上就**拒绝加载**。
         ⚠️ 升级版本时**必须同时更新 integrity**，算法与取法见 tests/e2e/_p10_docs_links.py 的说明。 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"
            integrity="sha384-H+hy9ULve6xfxRkWIh/YOtvDdpXgV2fmAGQkIDTxIgZwNoaoBal14Di2YTMR6MzR"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>
	<meta name="yandex-verification" content="3d08923d49b82f5c" />
	<link rel="canonical" href="https://smartdns-edge.pages.dev/" />
    
    <style>
        /* 1. 现代 CSS 变量（主题切换） */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --text-primary: #24292f;
            --text-secondary: #57606a;
            --border-color: #d0d7de;
            --accent-color: #0969da;
            --accent-hover: #0550ae;
            --code-bg: #f6f8fa;
            --sidebar-bg: #ffffff;
            --sidebar-active-bg: #f0f3f6;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        html.dark {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --code-bg: #161b22;
            --sidebar-bg: #0d1117;
            --sidebar-active-bg: #21262d;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        /* 2. 基础重置与网格排版 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 3. 顶部导航栏样式 */
         .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            height: 70px;
        }

        .header-container {
            max-width: 1300px;
            width: 90%;
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap; 
        }

        .main-nav {
            display: flex;
            gap: clamp(4px, 1vw, 12px);
            height: 100%;
        }

        .nav-item {
            background: none;
            border: none;
            font-size: 1rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0 clamp(8px, 1.2vw, 14px); 
            font-weight: 500;
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item.active::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--accent-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        #lang-select {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            cursor: pointer;
            outline: none;
        }

        .btn-toggle {
            background: none;
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .btn-toggle:hover {
            background-color: var(--border-color);
        }

        @media (max-width: 1150px) {
            .header-container {
                width: 94%; 
                gap: 10px;
            }
            .main-nav {
                gap: 4px; 
            }
            .nav-item {
                padding: 0 8px; 
                font-size: 0.92rem;
            }
        }

        @media (max-width: 1000px) {
            .header-container {
                gap: 6px;
            }
            .logo {
                font-size: 1.15rem;
            }
            .nav-item {
                padding: 0 6px;
                font-size: 0.88rem;
            }
        }

        /* 4. 双布局容器设计 */
        .layout-wrapper {
            flex: 1;
            display: flex;
            width: 90%;
            margin: 20px auto 100px auto;
            gap: 40px;
            transition: max-width 0.3s;
        }

        /* 配置指导页面的双栏最大宽度 */
        .layout-wrapper:not(.no-sidebar) {
            max-width: 1250px;
        }

        /* 其他页面的单栏最大宽度限制 */
        .layout-wrapper.no-sidebar {
            max-width: 1250px;
        }

        /* 5. 侧边栏样式 */
        .sidebar {
            width: 250px;
            flex-shrink: 0;
            position: sticky;
            top: 110px;
            height: calc(100vh - 190px);
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
            padding-right: 20px;
        }

        .no-sidebar .sidebar {
            display: none;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-item {
            padding: 10px 14px;
            font-size: 0.92rem;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            margin-bottom: 6px;
            transition: all 0.2s;
        }

        .sidebar-item:hover {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background-color: var(--sidebar-active-bg);
            color: var(--accent-color);
            font-weight: 600;
        }

        /* 6. 内容区排版 */
        .content-area {
            flex-grow: 1;
            min-width: 0;
        }

        /* 7. Markdown 标准化渲染样式 */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: var(--text-primary);
            margin-top: 20px;
            margin-bottom: 12px;
            font-weight: 600;
            line-height: 1.25;
        }

        .markdown-body h1 {
            font-size: 1.3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .markdown-body h2 {
            font-size: 1.15rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .markdown-body h3 {
            font-size: 1rem;
        }

        .markdown-body p, .markdown-body ul, .markdown-body ol {
            margin-bottom: 12px;
            font-size: 1rem; 
            line-height: 1.5; 
            color: var(--text-primary);
        }

        .markdown-body ul, .markdown-body ol {
            padding-left: 2em;
        }

        .markdown-body li {
            margin-top: 0.25em;
        }

        .markdown-body a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .markdown-body a:hover {
            text-decoration: underline;
        }

        /* Markdown 表格高宽屏自适应 */
        .markdown-body table {
            display: block;
            width: 100%;
            width: max-content;
            max-width: 100%;
            overflow: auto;
            border-collapse: collapse;
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 0.92rem;
        }

        /* 🔐 配置项总表（5 列）：固定列宽。
           原样式是 `display:block` + `width:max-content` —— 列宽由**内容最长的行**
           决定（`server` 那行的参数列表极长），于是其余行里"功能说明"被挤成窄条、
           "可用值/要求"大片留白，整张表各行的视觉宽度参差不齐。

           ⚠️ 这里必须同时改回 `display: table`：`table-layout: fixed` **只对表格盒生效**，
           在 `display: block` 下会被忽略。代价是这张表不再横向滚动，而是靠折行适配窄屏
           （其内容本来就用 `<br />` 分行，折行无副作用）。 */
        .markdown-body table:has(th:nth-child(5)) {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .markdown-body table:has(th:nth-child(5)) th:nth-child(1) { width: 12%; } /* 键名 */
        .markdown-body table:has(th:nth-child(5)) th:nth-child(2) { width: 27%; } /* 功能说明 */
        .markdown-body table:has(th:nth-child(5)) th:nth-child(3) { width: 8%; }  /* 默认值 */
        .markdown-body table:has(th:nth-child(5)) th:nth-child(4) { width: 38%; } /* 可用值/要求 */
        .markdown-body table:has(th:nth-child(5)) th:nth-child(5) { width: 15%; } /* 举例 */

        /* 固定列宽后，超长 token（如整条 openssl 命令）必须能折行，否则会溢出格子 */
        .markdown-body table:has(th:nth-child(5)) td,
        .markdown-body table:has(th:nth-child(5)) th {
            overflow-wrap: anywhere;
        }

        /* 窄屏：5 列表格在手机上按比例压缩后会过窄，改为允许横向滚动 */
        @media (max-width: 850px) {
            .markdown-body table:has(th:nth-child(5)) {
                display: block;
                width: max-content;
                min-width: 100%;
                table-layout: auto;
            }

            .markdown-body table:has(th:nth-child(5)) th:nth-child(1) { width: 130px; }
            .markdown-body table:has(th:nth-child(5)) th:nth-child(2) { width: 300px; }
            .markdown-body table:has(th:nth-child(5)) th:nth-child(3) { width: 90px; }
            .markdown-body table:has(th:nth-child(5)) th:nth-child(4) { width: 420px; }
            .markdown-body table:has(th:nth-child(5)) th:nth-child(5) { width: 170px; }
        }

        .markdown-body th, .markdown-body td {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
        }

        .markdown-body th {
            font-weight: 600;
            background-color: var(--bg-secondary);
        }

        .markdown-body tr:nth-child(even) {
            background-color: var(--bg-secondary);
        }

        /* Markdown 代码块格式化 */
        .markdown-body pre {
            padding: 16px;
            overflow: auto;
            font-size: 85%;
            line-height: 1.45;
            background-color: var(--code-bg);
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .markdown-body code {
            padding: .2em .4em;
            margin: 0;
            font-size: 85%;
            background-color: var(--code-bg);
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
        }

        .markdown-body pre code {
            padding: 0;
            margin: 0;
            font-size: 100%;
            background-color: transparent;
            border-radius: 0;
        }

        .markdown-body blockquote {
            padding: 0 1em;
            color: var(--text-secondary);
            border-left: .25em solid var(--border-color);
            margin-bottom: 16px;
        }

        /* 8. 辅助状态样式 */
        .loading {
            font-size: 1.1rem;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px 0;
        }

        .error-msg {
            color: #cf222e;
            background-color: #ffebe9;
            border: 1px solid #ff8182;
            padding: 18px;
            border-radius: 6px;
            margin: 20px 0;
            line-height: 1.6;
        }

        html.dark .error-msg {
            color: #ff8182;
            background-color: #311;
            border-color: #622;
        }

        /* 9. 页脚样式 */
        .site-footer {
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            padding: 12px 0;
            font-size: 0.88rem;
            color: var(--text-secondary);
            text-align: center;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            box-shadow: 0 -2px 10px var(--shadow);
        }

        .site-footer a {
            color: var(--accent-color);
            text-decoration: none;
        }
		
		/* 10. 针对 720p 级别及 4:3 / 5:4 窄屏的响应式自适应优化 */
        @media (max-width: 1150px) {
            /* 在窄屏下缩减两边留白与侧边栏宽度，为正文腾出更多阅读空间 */
            .layout-wrapper {
                gap: 24px;         /* 间距由 40px 缩减为 24px */
                width: 94%;        /* 页面左右白边从 5% 缩减为 3% */
            }
            .sidebar {
                width: 210px;      /* 侧边栏由 250px 缩减为 210px */
                padding-right: 16px;
            }
            .header-container {
                width: 94%;
            }
        }

        @media (max-width: 850px) {
            /* 在极端窄屏（如 800x600 屏，或用户在桌面将浏览器左右分屏）下 */
            /* 双栏自动转为单栏上下堆叠，彻底防止排版被挤压变形 */
            .layout-wrapper:not(.no-sidebar) {
                flex-direction: column;
                gap: 32px;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding-right: 0;
                padding-bottom: 16px;
            }
            /* 侧边栏子菜单在单栏模式下改为水平流式排版 */
            .sidebar-menu {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .sidebar-item {
                margin-bottom: 0;
                padding: 8px 12px;
            }
        }
		
		/* 12. 确保 Markdown 正文里的图片能在高分辨率屏幕下自动等比例收缩，绝不撑破排版 */
        .markdown-body img {
            max-width: 100%;
            height: auto;
            border-radius: 6px; /* 可选：圆角处理，观感更加现代 */
        }
		
		/* 13. 隐藏下载链接样式（彻底禁止文字选中与右键复制） */
        .dl-link {
            color: var(--accent-color);
            cursor: pointer;
            text-decoration: underline;
            font-weight: 500;
            transition: color 0.15s;
            /* 🌟 物理防御：全方位强行禁止用户鼠标选中/高亮该下载文字 */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        .dl-link:hover {
            color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <!-- 顶栏区域 -->
    <header class="site-header">
        <div class="header-container">
            <div class="logo" id="header-logo">🐋 SmartDNS Edge</div>
            <nav class="main-nav" id="main-nav"></nav>
            <div class="header-actions">
                <select id="lang-select">
                    <option value="zh">简体中文</option>
                    <option value="en">English</option>
                </select>
                <button class="btn-toggle" id="theme-toggle" aria-label="Toggle Theme">🌙</button>
            </div>
        </div>
    </header>

    <!-- 主体区域（双/单布局动态切换） -->
    <div class="layout-wrapper no-sidebar" id="layout-container">
        <!-- 侧边栏（按需显示） -->
        <aside class="sidebar" id="sidebar">
            <ul class="sidebar-menu" id="sidebar-menu"></ul>
        </aside>
        
        <!-- 主文档渲染区 -->
        <main class="content-area">
            <article class="markdown-body" id="markdown-content">
                <div class="loading">Loading...</div>
            </article>
        </main>
    </div>

    <!-- 页脚区域 -->
    <footer class="site-footer">
        <div class="footer-container">
            <p>Copyright © 2026 Gdxz.Linus. Open sourced under GPL-3.0-only. Hosted on <a href="https://github.com/Gdxz-Linus/smartdns-edge" target="_blank" rel="noopener noreferrer">GitHub</a>.</p>
            <!-- 🔐 问题 23：第三方统计的隐私说明（文案由 JS 按当前语言填充，见 renderFooterPrivacy）。
                 本页会向第三方服务（komarev.com）发一个访问计数请求，
                 该请求会把访客的 IP、浏览器标识（User-Agent）与来源页暴露给对方。
                 此前页面上**没有任何说明** —— 用户无从得知这件事。
                 这里如实告知，并说明它不影响功能、以及如何自行拦截。 -->
            <p class="footer-privacy" id="footer-privacy"
               style="font-size: 0.82rem; color: var(--text-secondary); margin-top: 6px; line-height: 1.5;"></p>
        </div>
    </footer>


    <!-- 10. 交互逻辑 JavaScript
         问题 23：原先这里是内联的 script 块（约 460 行），现已抽到 app.js。
         原因：CSP 的 script-src 若要放行内联脚本就得维护一个 hash（改一个字即失效，
         而失效的表现是整页脚本被拦、官网白屏，静态检查看不出来）。
         抽成外部文件后 script-src self 即可，没有需要同步维护的哈希。
         注意：不要改回内联 —— 内联会被 CSP 拦下。 -->
    <script src="./app.js"></script>
</body>
</html>
